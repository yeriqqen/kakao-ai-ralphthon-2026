<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fafaf7">
  <title>YOKOBU · A little more local.</title>
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/v2/theme.css">
  <link rel="stylesheet" href="/v2/styles.css">
  <script type="module" src="/v2/customer.js"></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true"><defs>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5l14 14M5 19 19 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/></symbol>
    <symbol id="i-shop" viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
  </defs></svg>
  <a class="skip-link" href="#main" data-ui="skip">Skip to conversation</a>
  <div class="chat-app">
    <header class="app-header">
      <div class="brand-block"><a class="brand" href="/v2/" aria-label="Yokobu"><svg class="icon brand-mark" aria-hidden="true"><use href="#i-spark"/></svg>yokobu<span class="brand-dot" aria-hidden="true">.</span></a><span id="subtitle"></span></div>
      <div class="header-actions"><span id="fixed-language"></span><button id="new-chat" class="quiet-button new-chat" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span id="new-chat-label"></span></button></div>
    </header>
    <main id="main" tabindex="-1">
      <div class="conversation-meta"><span id="simulation-label"></span></div>
      <section id="welcome" class="welcome">
        <div class="hero-mark" aria-hidden="true"><svg class="icon"><use href="#i-spark"/></svg></div>
        <h1 id="welcome-title"></h1><p id="welcome-intro"></p>
        <fieldset class="language-picker"><legend id="language-label" class="sr-only"></legend><div id="language-options"></div></fieldset>
      </section>
      <div id="composer-dock" class="composer-dock">
        <form id="chat-form" class="composer" novalidate>
          <textarea id="message-input" rows="2" maxlength="6000" autocomplete="off"></textarea>
          <div class="composer-bottom"><span class="composer-hint"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg><span data-ui="chatHint"></span></span><button id="send" class="send-button" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg><span id="send-label" class="sr-only"></span></button></div>
        </form>
        <p id="text-note" class="composer-note"></p>
      </div>
      <section id="home-starters" class="starters" aria-label="Conversation starters">
        <button id="starter" class="starter-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span><strong data-ui="clinicTitle"></strong><small data-ui="clinicDetail"></small></span><svg class="icon starter-arrow" aria-hidden="true"><use href="#i-right"/></svg></button>
        <button id="shop-starter" class="starter-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-shop"/></svg><span><strong data-ui="shopTitle"></strong><small data-ui="shopDetail"></small></span><svg class="icon starter-arrow" aria-hidden="true"><use href="#i-right"/></svg></button>
        <button class="starter-button" type="button" data-prompt="everydayPrompt"><svg class="icon" aria-hidden="true"><use href="#i-spark"/></svg><span><strong data-ui="everydayTitle"></strong><small data-ui="everydayDetail"></small></span><svg class="icon starter-arrow" aria-hidden="true"><use href="#i-right"/></svg></button>
      </section>
      <section id="configuration" class="notice" aria-live="polite"></section>
      <section id="call-state" class="call-state" aria-live="polite" hidden><span class="call-dot" aria-hidden="true"></span><span id="call-state-text"></span></section>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div id="context"></div>
      <div id="working" class="working" role="status" hidden></div>
      <section id="error" class="error-notice" role="alert" hidden><p id="error-text"></p><button id="dismiss-error" class="quiet-button" type="button"></button></section>
      <div id="scroll-anchor"></div>
    </main>
  </div>
  <button id="latest-message" class="latest-message" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg><span data-ui="latest"></span></button>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body"><form method="dialog"><h2 id="dialog-title" tabindex="-1"></h2><p id="dialog-body"></p><div class="button-row"><button id="dialog-cancel" class="quiet-button" value="cancel"></button><button id="dialog-confirm" class="primary-button" value="confirm"></button></div></form></dialog>
</body>
</html>
